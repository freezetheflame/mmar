<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MMAR — Many agents. One runtime.</title>
  <desc id="desc">Logical agents share a runtime with four execution slots and one persistent SQLite store. A dark blue and mint diagram introduces the minimal multi-agent runtime.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#112B32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#59D6B0" stop-opacity=".10"/>
      <stop offset="1" stop-color="#59D6B0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A8D4D7" stroke-opacity=".05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#59D6B0" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#background)"/>
  <rect x="680" y="16" width="580" height="388" rx="20" fill="url(#grid)"/>
  <ellipse cx="980" cy="215" rx="310" ry="205" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(56 42)">
      <rect width="44" height="44" rx="12" fill="#59D6B0" fill-opacity=".12" stroke="#59D6B0" stroke-opacity=".30"/>
      <path d="M10 31V13L22 25L34 13V31" fill="none" stroke="#79E4C5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="29" font-size="25" font-weight="700" letter-spacing="4" fill="#EDF7FA">MMAR</text>
    </g>
    <text x="56" y="167" font-size="64" font-weight="700" letter-spacing="-2" fill="#F1F7FC">Many agents.</text>
    <text x="56" y="237" font-size="64" font-weight="700" letter-spacing="-2" fill="#79E4C5">One runtime.</text>
    <text x="59" y="286" font-size="20" fill="#A8BDC8">Event-driven coordination. Durable memory.</text>
    <text x="59" y="321" font-size="16" letter-spacing="1.5" fill="#7895A6">PYTHON + ASYNCIO + SQLITE</text>
    <rect x="56" y="352" width="334" height="32" rx="16" fill="#59D6B0" fill-opacity=".08" stroke="#59D6B0" stroke-opacity=".20"/>
    <circle cx="74" cy="368" r="3" fill="#79E4C5"/>
    <text x="87" y="373" font-size="14" fill="#B6D7D4">Minimal core</text>
    <text x="197" y="373" font-size="14" fill="#526E7B">/</text>
    <text x="215" y="373" font-size="14" fill="#B6D7D4">Bounded execution</text>
    <text x="979" y="49" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#8AABB7">LOGICAL AGENTS, SHARED EXECUTION</text>
    <ellipse cx="979" cy="192" rx="203" ry="113" fill="none" stroke="#6C9BA3" stroke-opacity=".28" stroke-dasharray="3 8"/>
    <g fill="none" stroke="#59D6B0" stroke-opacity=".7" stroke-width="1.7" marker-end="url(#arrow)">
      <path d="M812 118L901 168"/>
      <path d="M1146 118L1057 168"/>
      <path d="M811 261L901 219"/>
      <path d="M1147 261L1057 219"/>
      <path d="M979 112V142"/>
      <path d="M979 250V306"/>
    </g>
    <g fill="#132633" stroke="#41616B" stroke-width="1.3">
      <circle cx="788" cy="104" r="32"/>
      <circle cx="1170" cy="104" r="32"/>
      <circle cx="788" cy="274" r="32"/>
      <circle cx="1170" cy="274" r="32"/>
      <circle cx="979" cy="81" r="29"/>
    </g>
    <g text-anchor="middle" font-size="13" font-weight="600" fill="#BBD0DB">
      <text x="788" y="109">A01</text>
      <text x="1170" y="109">A02</text>
      <text x="788" y="279">A03</text>
      <text x="1170" y="279">A30</text>
      <text x="979" y="86">···</text>
    </g>
    <rect x="893" y="145" width="172" height="106" rx="18" fill="#142D37" stroke="#79E4C5" stroke-width="1.6"/>
    <text x="979" y="178" text-anchor="middle" font-size="13" fill="#98BDBE">SHARED</text>
    <text x="979" y="207" text-anchor="middle" font-size="24" font-weight="600" fill="#E8FFF7">Runtime</text>
    <g fill="#79E4C5">
      <rect x="943" y="225" width="12" height="7" rx="2"/>
      <rect x="963" y="225" width="12" height="7" rx="2"/>
      <rect x="983" y="225" width="12" height="7" rx="2"/>
      <rect x="1003" y="225" width="12" height="7" rx="2"/>
    </g>
    <rect x="895" y="312" width="168" height="57" rx="12" fill="#11242F" stroke="#4B7480"/>
    <g transform="translate(914 327)" stroke="#8FB6C2" stroke-width="1.3" fill="none">
      <path d="M0 4V22C0 28 24 28 24 22V4"/>
      <ellipse cx="12" cy="4" rx="12" ry="4"/>
      <path d="M0 13C0 19 24 19 24 13"/>
    </g>
    <text x="954" y="336" font-size="15" font-weight="600" fill="#E0EBF1">SQLite</text>
    <text x="954" y="354" font-size="10" fill="#8AABB7">ATOMIC + PERSISTENT</text>
    <text x="979" y="397" text-anchor="middle" font-size="12" fill="#789AA6">Identity + memory per agent. Tasks only when active.</text>
  </g>
</svg>
