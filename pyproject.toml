[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmar-runtime"
version = "0.1.0"
description = "Minimal event-driven multi-agent runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["httpx>=0.28.1,<0.29"]

[project.scripts]
mmar = "mmar.cli:main"

[tool.setuptools.packages.find]
include = ["mmar*"]
